apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-cpu-poc
  labels:
    app: vllm-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-poc
  template:
    metadata:
      labels:
        app: vllm-poc
    spec:
      containers:
      - name: vllm
        # CPU-specific build — ships init_cpu_memory_env and CPU kernel extensions.
        # The GPU image (vllm/vllm-openai) lacks these C++ ops and cannot run on CPU.
        image: vllm/vllm-openai-cpu:latest
        command: ["vllm", "serve"]
        args:
        - "facebook/opt-125m"
        - "--port=8000"
        - "--enforce-eager"
        - "--dtype=float32"
        - "--gpu-memory-utilization=0.4"
        - "--max-model-len=512"
        ports:
        - containerPort: 8000
          name: http
        volumeMounts:
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-poc-svc
spec:
  selector:
    app: vllm-poc
  ports:
    - port: 8000
      targetPort: 8000
