# Scrape vLLM metrics. Requires the Prometheus Operator CRDs.
# The three series that matter are named in the lab README (C5).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
  labels: { app: vllm, release: prometheus }
spec:
  selector:
    matchLabels: { app: vllm }
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
# Autoscale on QUEUE DEPTH, not CPU. A GPU at 100% utilization might be serving
# 2 requests or 200; only num_requests_waiting tells you if anyone is waiting.
# Requires prometheus-adapter to expose the custom metric.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: vllm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: vllm-cpu
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Pods
      pods:
        metric: { name: vllm_num_requests_waiting }
        target:
          type: AverageValue
          averageValue: "5"