apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-cpu-poc
  labels:
    app: vllm-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm-poc
  template:
    metadata:
      labels:
        app: vllm-poc
    spec:
      containers:
      - name: vllm
        # Using the official CPU image. Note: requires AVX512 on the host node's CPU.
        image: vllm/vllm-openai:latest
        command: ["python3", "-m", "vllm.entrypoints.openai.api_server"]
        args:
        - "--model=facebook/opt-125m"
        - "--port=8000"
        - "--enforce-eager"
        ports:
        - containerPort: 8000
          name: http
---
apiVersion: v1
kind: Service
metadata:
  name: vllm-poc-svc
spec:
  selector:
    app: vllm-poc
  ports:
    - port: 8000
      targetPort: 8000
