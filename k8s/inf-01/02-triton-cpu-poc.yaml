apiVersion: apps/v1
kind: Deployment
metadata:
  name: triton-cpu-poc
  labels:
    app: triton-poc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triton-poc
  template:
    metadata:
      labels:
        app: triton-poc
    spec:
      containers:
      - name: triton
        image: nvcr.io/nvidia/tritonserver:23.10-py3
        args:
        - "tritonserver"
        - "--model-repository=/models"
        ports:
        - containerPort: 8000
          name: http
        - containerPort: 8001
          name: grpc
        - containerPort: 8002
          name: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: triton-poc-svc
spec:
  selector:
    app: triton-poc
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: grpc
      port: 8001
      targetPort: 8001
    - name: metrics
      port: 8002
      targetPort: 8002
